server:
  port: 8082

spring:
  application:
    name: sk2face-user-service
  datasource:
    url: jdbc:mysql://user-mysql:3306/sk2face_user
    username: sk2face
    password: sk2face123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
eureka:
  client:
    service-url:
      defaultZone: http://registry:8761/eureka/
